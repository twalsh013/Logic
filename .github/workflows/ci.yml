name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-target-

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy (linter)
      run: cargo clippy --all-targets --all-features -- -W clippy::correctness -W clippy::suspicious -W clippy::complexity -W clippy::perf

    - name: Run unit tests
      run: cargo test --verbose

    - name: Test output summary
      if: success()
      run: echo "✅ All tests passed successfully!"

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-target-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-target-release-

    - name: Build release binary
      run: cargo build --release --verbose

    - name: List release directory contents
      run: |
        echo "Contents of target/release:"
        ls -lh target/release/
        echo ""
        echo "Looking for executable files:"
        find target/release -maxdepth 1 -type f -executable

    - name: Verify binary exists
      run: |
        if [ -f "target/release/logic" ]; then
          ls -lh target/release/logic
          echo "Binary found successfully"
        else
          echo "ERROR: Binary not found at target/release/logic"
          exit 1
        fi

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: logic-${{ github.sha }}
        path: target/release/logic
        retention-days: 30

    - name: Build summary
      if: success()
      run: |
        echo "✅ Release binary built successfully!"
        echo "📦 Artifact: logic-${{ github.sha }}"
        echo "📊 Binary size: $(du -h target/release/logic | cut -f1)"
